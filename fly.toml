# fly.toml app configuration file generated for casinoroyale on 2026-05-28T20:16:20+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'casinoroyale'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "casino_db_volume"
  destination = "/data"

[env]
  DATABASE_PATH = "/data/poker_database.sqlite"
  PORT = "8080"
